quarkus.application.name=critical-notifier
quarkus.http.port=8082

quarkus.log.level=INFO
quarkus.log.category."br.com.fiap.feedback".level=DEBUG

# Única função exportada no Funqy; na Lambda, cada mensagem do SQS vira um CriticalFeedbackEvent
quarkus.funqy.export=notify-critical-feedback

# AWS (só no build do profile lambda): tópico do e-mail vem da variável de ambiente da Lambda
critical.topic.arn=${CRITICAL_TOPIC_ARN:}
notification.zone-id=America/Sao_Paulo

# Cobertura dos @QuarkusTest no mesmo arquivo do agente JaCoCo (ver pom.xml raiz)
%test.quarkus.jacoco.reuse-data-file=true
%test.quarkus.jacoco.report=false
