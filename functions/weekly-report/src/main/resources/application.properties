quarkus.application.name=weekly-report
quarkus.http.port=8083

quarkus.log.level=INFO
quarkus.log.category."br.com.fiap.feedback".level=DEBUG

# Cobertura dos @QuarkusTest no mesmo arquivo do agente JaCoCo (ver pom.xml raiz)
%test.quarkus.jacoco.reuse-data-file=true
%test.quarkus.jacoco.report=false

# Fuso usado para fechar os dias do relatório
report.zone-id=America/Sao_Paulo

# Única função exportada no Funqy; na AWS é chamada pelo EventBridge Scheduler toda segunda às 08:00
quarkus.funqy.export=generate-weekly-report

# AWS (só no build do profile lambda): tabela e tópico vêm das variáveis de ambiente da Lambda
feedback.table=${FEEDBACK_TABLE:feedbacks}
feedback.day-index=por-dia
report.topic.arn=${REPORT_TOPIC_ARN:}
