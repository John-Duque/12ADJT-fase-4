name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, testes e Sonar
    runs-on: ubuntu-24.04
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Histórico completo para o Sonar calcular blame e código novo
          fetch-depth: 0

      - name: Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build e testes
        run: mvn -B -ntp verify

      - name: Cache do Sonar
        if: env.SONAR_TOKEN != ''
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Análise SonarQube Cloud
        if: env.SONAR_TOKEN != ''
        run: mvn -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

      - name: Aviso de Sonar não configurado
        if: env.SONAR_TOKEN == ''
        run: echo "::warning title=Sonar::Secret SONAR_TOKEN não configurado; a análise do Sonar foi pulada."

      - name: Publicar relatórios de teste
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-de-teste
          path: |
            **/target/surefire-reports/
            **/target/site/jacoco/
          retention-days: 7
