name: Docker

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Imagem ${{ matrix.module }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: feedback-ingestion
            port: 8081
            description: >-
              Função HTTP de entrada da plataforma de feedback. POST /avaliacao com {"descricao": texto, "nota": 0 a 10}:
              valida, classifica a urgência (0-3 HIGH, 4-6 MEDIUM, 7-10 LOW), grava e publica as críticas para o critical-notifier.
              Responde 201 com id, urgencia e dataEnvio, ou 400 com a mensagem da validação. Porta 8081, health em /q/health.
              Documentação: functions/feedback-ingestion/README.md
          - module: critical-notifier
            port: 8082
            description: >-
              Função que avisa os administradores sobre avaliações críticas. Recebe o CriticalFeedbackEvent da fila
              (localmente, POST /notify-critical-feedback) e, se a urgência for HIGH, envia o alerta com descrição, urgência
              e data de envio; responde feedbackId e notified. Porta 8082, health em /q/health.
              Documentação: functions/critical-notifier/README.md
          - module: weekly-report
            port: 8083
            description: >-
              Função agendada que consolida a semana: avaliações dos 7 dias anteriores com quantidade por dia, por urgência
              e média das notas, entregue aos administradores (localmente, POST /generate-weekly-report). Fuso configurável
              por REPORT_ZONE_ID (padrão America/Sao_Paulo). Porta 8083, health em /q/health.
              Documentação: functions/weekly-report/README.md
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Nome da imagem
        # O GHCR exige o nome em minúsculas
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.module }}" >> "$GITHUB_ENV"

      - name: Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Tags e labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          # Sem isso as três imagens mostram a descrição do repositório no GHCR
          labels: |
            org.opencontainers.image.title=${{ matrix.module }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}/tree/main/functions/${{ matrix.module }}

      - name: Build da imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          build-args: |
            MODULE=${{ matrix.module }}
            PORT=${{ matrix.port }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          push: false
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}

      - name: Smoke test
        env:
          PORT: ${{ matrix.port }}
          TAG: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          docker run -d --name smoke -p "$PORT:$PORT" "$TAG"
          for attempt in $(seq 1 30); do
            if curl -fsS "http://localhost:$PORT/q/health/ready"; then
              echo
              echo "Função respondeu na tentativa $attempt"
              exit 0
            fi
            sleep 2
          done
          echo "::error title=Smoke test::${{ matrix.module }} não ficou pronta em /q/health/ready"
          docker logs smoke
          exit 1

      - name: Login no GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar no GHCR
        if: github.event_name == 'push'
        run: docker push --all-tags "$IMAGE"
