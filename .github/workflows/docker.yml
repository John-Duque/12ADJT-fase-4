name: Docker

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Imagem ${{ matrix.module }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: feedback-ingestion
            port: 8081
            description: Recebe POST /avaliacao, valida, grava a avaliação e publica as críticas na fila
          - module: critical-notifier
            port: 8082
            description: Consome a fila de avaliações críticas e envia o e-mail de urgência aos administradores
          - module: weekly-report
            port: 8083
            description: "Gera o relatório semanal: avaliações por dia, por urgência e média das notas"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Nome da imagem
        # O GHCR exige o nome em minúsculas
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.module }}" >> "$GITHUB_ENV"

      - name: Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Tags e labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          # Sem isso as três imagens mostram a descrição do repositório no GHCR
          labels: |
            org.opencontainers.image.title=${{ matrix.module }}
            org.opencontainers.image.description=${{ matrix.description }}

      - name: Build da imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          build-args: |
            MODULE=${{ matrix.module }}
            PORT=${{ matrix.port }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          push: false
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}

      - name: Smoke test
        env:
          PORT: ${{ matrix.port }}
          TAG: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          docker run -d --name smoke -p "$PORT:$PORT" "$TAG"
          for attempt in $(seq 1 30); do
            if curl -fsS "http://localhost:$PORT/q/health/ready"; then
              echo
              echo "Função respondeu na tentativa $attempt"
              exit 0
            fi
            sleep 2
          done
          echo "::error title=Smoke test::${{ matrix.module }} não ficou pronta em /q/health/ready"
          docker logs smoke
          exit 1

      - name: Login no GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar no GHCR
        if: github.event_name == 'push'
        run: docker push --all-tags "$IMAGE"
