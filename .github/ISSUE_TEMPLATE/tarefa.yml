name: Tarefa
description: Uma entrega do kanban (funcionalidade, infraestrutura, documentação etc.)
labels: []
body:
  - type: textarea
    id: contexto
    attributes:
      label: Contexto
      description: Por que essa tarefa existe e qual requisito do Tech Challenge ela atende
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: Critérios de aceite
      description: Lista verificável do que precisa estar pronto
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: notas
    attributes:
      label: Notas técnicas
      description: Links, decisões, dependências de outras issues
